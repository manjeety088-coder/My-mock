<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes</title>

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
}

/* HEADER */
.header{
text-align:center;
padding:18px;
font-size:22px;
font-weight:700;
color:#38bdf8;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
padding:14px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.06);
border-radius:14px;
padding:16px;
cursor:pointer;
height:130px;
display:flex;
flex-direction:column;
justify-content:space-between;
border:1px solid rgba(255,255,255,0.1);
transition:.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 20px rgba(56,189,248,0.5);
}

/* BIG TEXT */
.name{
font-size:15px;
font-weight:600;
line-height:1.3;
}

.small{
font-size:13px;
color:#94a3b8;
}

/* MOBILE PERFECT */
@media (max-width:500px){
.name{font-size:14px;}
.small{font-size:12px;}
}
</style>
</head>

<body>

<div class="header" id="title">Loading...</div>
<div class="container" id="classes"></div>

<script>

const params = new URLSearchParams(location.search)
const subject = params.get("subject")

document.getElementById("title").innerText = subject

fetch("data.json")
.then(res=>res.json())
.then(data=>{

const filtered = data.filter(x => x.subject === subject)

const container = document.getElementById("classes")

filtered.forEach(cls=>{
    container.innerHTML += `
    <div class="card" onclick="play('${cls.m3u8}')">
        <div class="name">${cls.chapter}</div>
        <div class="small">Class ${cls.class_no}</div>
    </div>`
})

})

function play(url){
location.href = "player.html?video=" + encodeURIComponent(url)
}

</script>


<script>
    // URL Masking Script
    window.addEventListener("load", function() {
        if (window.location.pathname.endsWith('.html') && window.location.pathname !== '/index.html') {
            let cleanUrl = window.location.pathname.replace('.html', '');
            window.history.replaceState(null, '', cleanUrl);
        }
    });
</script>
</body>

</html>
