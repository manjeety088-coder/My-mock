<html>
    <head>
        <title>Yadav ka chhora</title>

        <style>
            body {
                background-color: #111;
                color: white;
                text-align: center;
                font-family: Arial;
            }

            h1 {
                color: red;
                font-size: 50px;
                margin-top: 100px;
            }

            p {
                color: yellow;
                font-size: 24px;
            }

            .box {
                background-color: #222;
                width: 400px;
                margin: auto;
                padding: 30px;
                border-radius: 20px;
                border: 2px solid red;
            }

            button {
                background-color: red;
                color: white;
                font-size: 20px;
                padding: 12px 25px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
            }

            button:hover {
                background-color: green;
            }
        </style>
    </head>

    <body>
        <div class="box">
            <h1>Yadav ka chhora</h1>
            <p>Ye meri first website hai</p>
            <button>Click karo</button>
        </div>
    </body>
</html>
