    <style>
        :root{
            --gold:#ffcc00;
            --gold-2:#ff9f1c;
            --cyan:#00e5ff;
            --pink:#ff2e88;
            --green:#18e6a2;
            --bg:#050508;
            --panel:rgba(255,255,255,.055);
            --panel-2:rgba(255,255,255,.085);
            --border:rgba(255,255,255,.11);
            --muted:#a6adbb;
            --text:#ffffff;
            --shadow:0 24px 80px rgba(0,0,0,.55);
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{
            font-family:'Outfit',sans-serif;
            min-height:100vh;
            color:var(--text);
            background:
                radial-gradient(circle at 12% 8%, rgba(255,204,0,.16), transparent 32%),
                radial-gradient(circle at 88% 15%, rgba(0,229,255,.13), transparent 34%),
                radial-gradient(circle at 50% 95%, rgba(255,46,136,.10), transparent 35%),
                linear-gradient(140deg,#050508 0%,#090912 55%,#020203 100%);
            overflow-x:hidden;
        }
        body::before{
            content:"";
            position:fixed;inset:0;pointer-events:none;z-index:-2;
            background-image:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
            background-size:46px 46px;
            mask-image:linear-gradient(to bottom, rgba(0,0,0,.8), transparent 78%);
        }
        body::after{
            content:"";
            position:fixed;inset:-20%;z-index:-1;pointer-events:none;
            background:conic-gradient(from 180deg, transparent, rgba(255,204,0,.08), transparent, rgba(0,229,255,.08), transparent);
            filter:blur(70px);
            animation:spinGlow 18s linear infinite;
        }
        @keyframes spinGlow{to{transform:rotate(360deg)}}
        a{text-decoration:none;color:inherit}
        .topbar{
            position:sticky;top:0;z-index:1000;
            display:flex;align-items:center;justify-content:space-between;gap:16px;
            padding:14px 5%;
            background:rgba(5,5,8,.72);
            backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
            border-bottom:1px solid var(--border);
            box-shadow:0 10px 40px rgba(0,0,0,.25);
        }
        .brand{display:flex;align-items:center;gap:14px;min-width:0}
        .back-btn{
            width:42px;height:42px;border-radius:16px;border:1px solid var(--border);
            background:var(--panel);color:#fff;display:grid;place-items:center;
            transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.18)
        }
        .back-btn:hover{transform:translateX(-3px);border-color:rgba(255,204,0,.6);color:var(--gold);background:rgba(255,204,0,.08)}
        .logo-badge{
            display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:18px;
            background:linear-gradient(135deg, rgba(255,204,0,.18), rgba(255,255,255,.045));
            border:1px solid rgba(255,204,0,.22);box-shadow:0 0 28px rgba(255,204,0,.11);
            font-weight:900;letter-spacing:.8px;white-space:nowrap;
        }
        .logo-mark{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--cyan));box-shadow:0 0 20px var(--gold)}
        .top-actions{display:flex;align-items:center;gap:10px}
        .pill{
            border:1px solid var(--border);background:var(--panel);color:#dce3ef;border-radius:999px;
            padding:10px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;transition:.25s;
        }
        .pill:hover{border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.08);transform:translateY(-1px)}
        .hero{padding:54px 5% 26px;max-width:1320px;margin:0 auto}
        .hero-card{
            position:relative;overflow:hidden;border-radius:34px;padding:42px;
            border:1px solid var(--border);background:linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
            box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
        }
        .hero-card::after{
            content:"";position:absolute;right:-120px;top:-120px;width:330px;height:330px;border-radius:50%;
            background:radial-gradient(circle, rgba(255,204,0,.24), transparent 66%);filter:blur(10px)
        }
        .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,204,0,.1);border:1px solid rgba(255,204,0,.2);color:var(--gold);font-weight:800;font-size:12px;letter-spacing:1.6px;text-transform:uppercase}
        h1{font-size:clamp(40px,6vw,82px);line-height:.95;margin:18px 0 12px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#fff 25%,#ffdf55 55%,#98f4ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .hero p{max-width:760px;color:#b8c0cf;font-size:17px;line-height:1.6}
        .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px;max-width:720px}
        .stat{border:1px solid var(--border);background:rgba(0,0,0,.23);border-radius:20px;padding:17px}
        .stat b{font-size:27px;color:#fff;display:block}.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
        .toolbar{position:sticky;top:70px;z-index:900;padding:14px 5%;background:linear-gradient(180deg,rgba(5,5,8,.92),rgba(5,5,8,.72));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
        .toolbar-inner{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
        .search-wrap{position:relative}
        .search-wrap i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--gold)}
        .search-box{width:100%;border:1px solid var(--border);outline:none;border-radius:18px;background:rgba(255,255,255,.06);color:#fff;padding:16px 18px 16px 48px;font-size:15px;font-weight:600;transition:.25s}
        .search-box:focus{border-color:rgba(255,204,0,.55);box-shadow:0 0 0 4px rgba(255,204,0,.08),0 0 34px rgba(255,204,0,.08)}
        .select-box{border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.06);color:#fff;padding:15px 16px;outline:none;font-weight:800;min-width:210px}
        .select-box option{background:#111;color:#fff}
        #main-content{max-width:1320px;margin:0 auto;padding:28px 5% 90px}
        .category-block{margin:0 0 34px;animation:fadeUp .45s ease both}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        .category-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 17px}
        .category-title{display:flex;align-items:center;gap:11px;min-width:0}
        .category-title .icon{width:42px;height:42px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg, rgba(255,204,0,.18), rgba(0,229,255,.09));border:1px solid rgba(255,204,0,.18);color:var(--gold);box-shadow:0 0 24px rgba(255,204,0,.08)}
        .category-title h2{font-size:23px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:#fff;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .count-badge{font-size:12px;font-weight:900;color:#111;background:linear-gradient(135deg,var(--gold),#fff2a6);padding:8px 12px;border-radius:999px;white-space:nowrap}
        .batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:18px}
        .batch-card{position:relative;overflow:hidden;min-height:135px;border-radius:24px;padding:20px;border:1px solid var(--border);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.035));cursor:pointer;transition:.32s;box-shadow:0 16px 36px rgba(0,0,0,.24);display:flex;flex-direction:column;justify-content:space-between}
        .batch-card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-120%) skewX(-18deg);transition:.75s}
        .batch-card:hover::before{transform:translateX(120%) skewX(-18deg)}
        .batch-card:hover{transform:translateY(-8px);border-color:rgba(255,204,0,.55);box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 28px rgba(255,204,0,.09);background:linear-gradient(145deg,rgba(255,204,0,.105),rgba(255,255,255,.045))}
        .batch-card h3{font-size:15px;font-weight:800;line-height:1.35;color:#f7f9ff;padding-right:28px;word-break:break-word}
        .batch-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
        .open-chip{color:#111;background:linear-gradient(135deg,var(--gold),var(--gold-2));padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900;box-shadow:0 10px 24px rgba(255,204,0,.15)}
        .empty-state{border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.035);border-radius:24px;padding:38px;text-align:center;color:var(--muted);font-weight:700}
        #videoModal{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:auto;padding:28px 14px}
        #videoModal.active{display:block}
        .modal-content{max-width:980px;margin:0 auto 30px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,rgba(17,17,23,.96),rgba(7,7,10,.96));box-shadow:0 30px 100px rgba(0,0,0,.75);overflow:hidden}
        .modal-head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;background:rgba(10,10,14,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
        .modal-title-wrap{min-width:0}.modal-label{color:var(--gold);font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:900}.modal-title{font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:700px;margin-top:3px}
        .close-btn{border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold),#fff1a1);color:#111;padding:12px 16px;font-weight:900;cursor:pointer;transition:.25s}.close-btn:hover{transform:scale(1.04)}
        .modal-tools{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.025)}
        .class-search{width:100%;border:1px solid var(--border);outline:none;border-radius:16px;background:rgba(255,255,255,.055);color:#fff;padding:13px 15px;font-weight:700}
        #videoListContainer{padding:18px 20px 22px}.chapter-header{margin:16px 0 10px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(255,204,0,.14),rgba(0,229,255,.055));border:1px solid rgba(255,204,0,.16);border-left:4px solid var(--gold);font-size:13px;font-weight:900;color:#ffe16a;text-transform:uppercase;letter-spacing:.9px}
        .video-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:10px;border:1px solid rgba(255,255,255,.085);background:rgba(255,255,255,.045);border-radius:18px;padding:13px 14px;transition:.25s}.video-item:hover{border-color:rgba(0,229,255,.28);background:rgba(255,255,255,.07);transform:translateY(-2px)}
        .video-title{font-size:14px;font-weight:750;line-height:1.45;color:#f4f7ff}.play-btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 15px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#111;font-size:12px;font-weight:950;white-space:nowrap;box-shadow:0 10px 24px rgba(255,204,0,.14)}.play-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
        .loader{text-align:center;padding:34px;color:var(--muted);font-weight:800}.loader i{color:var(--gold);font-size:28px;margin-bottom:10px;display:block;animation:pulse 1.1s infinite alternate}@keyframes pulse{to{transform:scale(1.12);opacity:.7}}
        .error-card{text-align:center;padding:34px;border:1px solid rgba(239,68,68,.22);background:rgba(239,68,68,.07);border-radius:20px;color:#ffb4b4;font-weight:800}.error-card small{display:block;color:#a7adbb;margin-top:8px;font-weight:700;line-height:1.5}
        ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:20px}::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
        @media(max-width:820px){.topbar{padding:12px 14px}.pill span{display:none}.hero{padding:28px 14px 18px}.hero-card{padding:28px 20px;border-radius:26px}.stats{grid-template-columns:1fr 1fr}.toolbar{top:67px;padding:12px 14px}.toolbar-inner{grid-template-columns:1fr}.select-box{width:100%;min-width:0}#main-content{padding:20px 14px 70px}.batch-grid{grid-template-columns:1fr}.category-title h2{font-size:18px}.modal-content{border-radius:22px}.modal-title{max-width:230px}.video-item{grid-template-columns:1fr}.play-btn{justify-content:center}.top-actions{gap:8px}.logo-badge{padding:9px 12px}}
        @media(max-width:480px){.stats{grid-template-columns:1fr}.hero p{font-size:15px}.stat{padding:14px}.back-btn{width:39px;height:39px;border-radius:14px}.logo-badge{font-size:14px}.modal-head{padding:14px}.modal-tools,#videoListContainer{padding-left:14px;padding-right:14px}}

        const container = document.getElementById('main-content');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const videoModal = document.getElementById('videoModal');
        const classSearch = document.getElementById('classSearch');
        let currentVideos = [];
        let currentBatchName = '';

        const totalCategories = Object.keys(courseData).length;
        const totalBatches = Object.values(courseData).reduce((sum, list) => sum + list.length, 0);
        document.getElementById('totalCategories').textContent = totalCategories;
        document.getElementById('totalBatches').textContent = totalBatches;

        Object.keys(courseData).forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            categoryFilter.appendChild(opt);
        });

        function escapeHtml(text = '') {
            return String(text).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
        }

        function categoryIcon(cat){
            const lower = cat.toLowerCase();
            if(lower.includes('math')) return 'fa-square-root-variable';
            if(lower.includes('reason')) return 'fa-brain';
            if(lower.includes('english')) return 'fa-language';
            if(lower.includes('gs')) return 'fa-earth-asia';
            if(lower.includes('railway')) return 'fa-train';
            if(lower.includes('selection')) return 'fa-graduation-cap';
            if(lower.includes('utkarsh')) return 'fa-fire';
            return 'fa-layer-group';
        }

        function render() {
            const filter = searchInput.value.trim().toLowerCase();
            const selectedCat = categoryFilter.value;
            container.innerHTML = '';
            let visible = 0;

            Object.entries(courseData).forEach(([cat, batches]) => {
                if(selectedCat !== 'all' && selectedCat !== cat) return;
                const filtered = batches.filter(b => (cat + ' ' + b).toLowerCase().includes(filter));
                if (!filtered.length) return;
                visible += filtered.length;

                const section = document.createElement('section');
                section.className = 'category-block';
                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-title">
                            <div class="icon"><i class="fa-solid ${categoryIcon(cat)}"></i></div>
                            <h2>${escapeHtml(cat)}</h2>
                        </div>
                        <span class="count-badge">${filtered.length} Batches</span>
                    </div>
                    <div class="batch-grid"></div>
                `;

                const grid = section.querySelector('.batch-grid');
                filtered.forEach(batch => {
                    const card = document.createElement('article');
                    card.className = 'batch-card';
                    card.innerHTML = `
                        <h3>${escapeHtml(batch)}</h3>
                        <div class="batch-meta">
                            <span><i class="fa-solid fa-folder-open"></i> Premium Batch</span>
                            <span class="open-chip">Open</span>
                        </div>
                    `;
                    card.addEventListener('click', () => openBatch(batch));
                    grid.appendChild(card);
                });
                container.appendChild(section);
            });

            document.getElementById('visibleBatches').textContent = visible;
            if(!visible){
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i><br><br>No batch found. Try another keyword.</div>`;
            }
        }

        function normalizeVideos(data){
            if(Array.isArray(data) && data[0] && Array.isArray(data[0].videos)) return data[0].videos;
            if(data && Array.isArray(data.videos)) return data.videos;
            if(Array.isArray(data) && data.every(x => x && (x.url || x.video || x.link || x.video_url || x.m3u8))) return data;
            return [];
        }

        function getVideoUrl(item){
            return item.url || item.video || item.link || item.video_url || item.m3u8 || '';
        }

        function getVideoTitle(item, index){
            return item.title || item.name || item.class || item.className || `Class ${index + 1}`;
        }

        function getChapterName(title){
            const parts = String(title).split('|');
            if(parts.length > 1 && parts[1].trim()) return parts[1].trim();
            const match = String(title).match(/chapter\s*[-:]?\s*([^|]+)/i);
            if(match && match[1]) return match[1].trim();
            return 'Classes';
        }

        async function openBatch(batchName) {
            currentBatchName = batchName;
            classSearch.value = '';
            videoModal.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('modalTitle').textContent = batchName;
            document.getElementById('videoListContainer').innerHTML = `<div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i>Fetching batch content...</div>`;

            try {
                const response = await fetch(`${batchName}.json`, { cache: 'no-store' });
                if (!response.ok) throw new Error('JSON file not found');
                const data = await response.json();
                currentVideos = normalizeVideos(data).map((item, index) => ({
                    title: getVideoTitle(item, index),
                    url: getVideoUrl(item),
                    index
                })).filter(v => v.url);

                renderClassList(currentVideos);
            } catch (e) {
                currentVideos = [];
                document.getElementById('videoListContainer').innerHTML = `
                    <div class="error-card">
                        <i class="fa-solid fa-triangle-exclamation"></i><br><br>
                        JSON File Not Found!
                        <small>Folder me exactly <b>${escapeHtml(batchName)}.json</b> file honi chahiye.</small>
                    </div>`;
            }
        }

        function renderClassList(videos){
            const listContainer = document.getElementById('videoListContainer');
            if(!videos.length){
                listContainer.innerHTML = `<div class="empty-state">No class found in this batch.</div>`;
                return;
            }

            let htmlContent = '';
            let currentChapter = '';
            videos.forEach((vid, idx) => {
                const chapterTitle = getChapterName(vid.title);
                if (chapterTitle !== currentChapter) {
                    currentChapter = chapterTitle;
                    htmlContent += `<div class="chapter-header"><i class="fa-solid fa-book-open"></i> ${escapeHtml(currentChapter)}</div>`;
                }
                const playUrl = `player.html?video=${encodeURIComponent(vid.url)}&title=${encodeURIComponent(vid.title)}&batch=${encodeURIComponent(currentBatchName)}`;
                htmlContent += `
                    <div class="video-item">
                        <div class="video-title"><span style="color:var(--gold);font-weight:900;">${String(idx + 1).padStart(2,'0')}.</span> ${escapeHtml(vid.title)}</div>
                        <a href="${playUrl}" class="play-btn"><i class="fa-solid fa-play"></i> Play</a>
                    </div>`;
            });
            listContainer.innerHTML = htmlContent;
        }

        function filterClasses(){
            const q = classSearch.value.trim().toLowerCase();
            renderClassList(currentVideos.filter(v => v.title.toLowerCase().includes(q)));
        }

        function closeModal(){
            videoModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function overlayClose(event){
            if(event.target.id === 'videoModal') closeModal();
        }

        document.addEventListener('keydown', e => {
            if(e.key === 'Escape' && videoModal.classList.contains('active')) closeModal();
        });

        searchInput.addEventListener('input', render);
        categoryFilter.addEventListener('change', render);
        render();

        window.addEventListener('load', function() {
            if (window.location.pathname.endsWith('.html') && window.location.pathname !== '/index.html') {
                const cleanUrl = window.location.pathname.replace('.html', '');
                window.history.replaceState(null, '', cleanUrl);
            }
        });
    </script>
