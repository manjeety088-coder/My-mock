<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SZX • PDF Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-gold: #ffcc00;
            --p-gold-glow: rgba(255, 204, 0, 0.5);
            --dark: #080808;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --p-red: #f43f5e; /* Premium Red for PDFs */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, #16161a, var(--dark) 80%);
            color: white;
            min-height: 100vh;
        }

        /* --- Premium Header --- */
        header { 
            padding: 15px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(8, 8, 8, 0.75); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            position: sticky; top: 0; 
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-icon { color: #fff; font-size: 20px; text-decoration: none; opacity: 0.7; transition: 0.3s; }
        .back-icon:hover { opacity: 1; color: var(--p-gold); transform: translateX(-3px); }
        .logo-text { font-size: 18px; font-weight: 700; color: white; letter-spacing: 1px; text-transform: uppercase; }

        .social-icons a { color: #fff; font-size: 20px; transition: 0.3s; opacity: 0.6; }
        .social-icons a:hover { opacity: 1; color: #0088cc; filter: drop-shadow(0 0 10px #0088cc); }

        /* --- Hero Section --- */
        .hero { 
            text-align: center; padding: 50px 5% 30px; 
            border-bottom: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(244, 63, 94, 0.05) 0%, transparent 100%);
        }
        .hero h1 { 
            font-size: 38px; font-weight: 800; margin-bottom: 8px; 
            background: linear-gradient(to right, #ffffff, #aaa); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            text-transform: capitalize;
        }
        .hero p { color: var(--p-red); font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        /* --- Grid Classes --- */
        #pdfContainer {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; padding: 30px 5% 80px; max-width: 1200px; margin: 0 auto;
        }

        /* CARD */
        .pdf-card {
            background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 25px 20px; cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; gap: 15px; position: relative; overflow: hidden;
        }

        /* Shine effect */
        .pdf-card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.03), transparent);
            transform: skewX(-25deg); transition: 0.7s;
        }

        .pdf-card:hover::after { left: 150%; }

        .pdf-card:hover {
            transform: translateY(-5px); border-color: var(--p-red);
            background: rgba(244, 63, 94, 0.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(244, 63, 94, 0.15);
        }

        /* ICON */
        .icon {
            font-size: 35px; transition: 0.4s;
            background: linear-gradient(45deg, #f43f5e, #fb923c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 10px rgba(244,63,94,0.2));
            flex-shrink: 0;
        }

        .pdf-card:hover .icon { transform: scale(1.1); filter: drop-shadow(0 5px 10px rgba(244,63,94,0.4)); }

        /* TEXT AREA */
        .text-area { display: flex; flex-direction: column; }
        .pdf-title { font-size: 15px; font-weight: 600; line-height: 1.3; color: white; text-transform: capitalize; margin-bottom: 5px; }
        .small-text { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        .no-data { text-align: center; color: #888; font-size: 18px; padding: 50px; grid-column: 1 / -1; }

        @media (max-width: 600px) {
            .hero { padding: 40px 5% 20px; }
            .hero h1 { font-size: 28px; }
            #pdfContainer { grid-template-columns: 1fr; gap: 15px; padding: 20px 5% 50px; }
            .pdf-card { padding: 20px 15px; }
            .icon { font-size: 30px; }
            .pdf-title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="sscvod.html" class="back-icon"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="logo-text">SZX • Study Material</div>
        </div>
        <div class="social-icons">
            <a href="https://t.me/szxmock" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </header>

    <div class="hero">
        <h1 id="pageTitle">Loading...</h1>
        <p>Premium PDF Notes</p>
    </div>

    <div id="pdfContainer">
        </div>

    <script>
        // 1. URL se subject ka naam nikalna (e.g., ?sub=Arithmetic)
        const urlParams = new URLSearchParams(window.location.search);
        let subjectName = urlParams.get('sub');
        
        // Agar URL me koi subject nahi hai, to sabhi PDFs dikhane ka option
        if(!subjectName) {
            subjectName = "All";
        }

        // Title update karna
        document.getElementById('pageTitle').innerText = subjectName + " Notes";

        async function loadPDFs() {
            const container = document.getElementById('pdfContainer');
            
            try {
                const res = await fetch("sscvodp.json");
                const data = await res.json();
                
                // 2. Data Filter karna
                let filteredData;
                if(subjectName === "All" || subjectName === "null") {
                    filteredData = data; // Sab dikhao agar All PDF Notes par click hua ho
                    document.getElementById('pageTitle').innerText = "All Complete Notes";
                } else {
                    // Sirf wahi PDF dikhao jiska subject URL wale subject se match kare
                    filteredData = data.filter(item => {
                        const sub = item.subject || item.subject_name || "Other";
                        return sub === subjectName;
                    });
                }

                // Agar koi PDF nahi mili
                if(filteredData.length === 0) {
                    container.innerHTML = `<div class="no-data">No PDF notes found for this section.</div>`;
                    return;
                }

                // 3. HTML Cards Banana
                filteredData.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'pdf-card';
                    
                    const chapterName = c.chapter || c.chapter_name || "Study Note";
                    const pdfNoText = c.pdf_no ? `PDF ${c.pdf_no} • ` : "";

                    div.innerHTML = `
                        <div class="icon"><i class="fa-solid fa-file-pdf"></i></div>
                        <div class="text-area">
                            <div class="pdf-title">${chapterName}</div>
                            <div class="small-text">${pdfNoText}Tap to View</div>
                        </div>
                    `;

                    // Click karne par PDF naye tab me open hogi
                    div.onclick = () => {
                        window.open(c.pdf_url || c.url || c.link, '_blank');
                    };

                    container.appendChild(div);
                });

            } catch (error) {
                console.error("Data load error:", error);
                container.innerHTML = `<div class="no-data" style="color:#f43f5e;">Error loading data. Check sscvodp.json file.</div>`;
            }
        }

        // Load data on start
        loadPDFs();

        // 4. URL Masking Script (Hide .html)
        window.addEventListener("load", function() {
            // URL params ko preserve karte hue sirf .html hatana hai
            let currentUrl = window.location.href;
            if (currentUrl.includes('.html')) {
                let newUrl = currentUrl.replace('.html', '');
                window.history.replaceState(null, '', newUrl);
            }
        });
    </script>
</body>
</html>
